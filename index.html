<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!-- Meta -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Título -->
  <title>Sandro Barbearia</title>

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <!-- CSS local -->
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- ================= HEADER ================= -->
  <header>
    <div class="logo">
      <img src="/imgs/1 (1).jpg" alt="Logo Sandro Barbearia" />
    </div>

    <h1>Sandro Barbearia</h1>
    <p>💈 Estilo e tradição desde 1999 💈</p>
  </header>

  <!-- ================= MAIN ================= -->
  <main>

  <!-- ===== Botões principais ===== -->
  <section class="links">
    <a
      href="https://wa.me/5533988017495"
      target="_blank"
      class="link-btn"
      aria-label="Abrir WhatsApp"
    >
      WhatsApp
    </a>

    <a
      href="https://www.instagram.com/sandrobarbearia.gv/"
      target="_blank"
      class="link-btn"
      aria-label="Abrir Instagram"
    >
      Instagram
    </a>

    <!-- Botão de rota -->
    <button
      class="link-btn"
      onclick="abrirMapa()"
      aria-label="Como chegar na barbearia"
    >
      📍 Como chegar
    </button>
  </section>

  <!-- ===== Mapa (mobile) ===== -->
  <section class="mapa" onclick="abrirMapa()" role="button">
    <iframe
      src="https://www.google.com/maps?q=R. Castro Alves, 331 - Centro, Gov. Valadares - MG&output=embed"
      width="100%"
      height="220"
      style="border:0; border-radius:12px; pointer-events:none;"
      loading="lazy"
    ></iframe>

    <p class="mapa-texto">📍 Toque no mapa para abrir a rota</p>
  </section>

  <!-- ===== Carrossel ===== -->
  <section class="mt-4">
    <div
      id="carouselSandro"
      class="carousel slide"
      data-bs-ride="carousel"
    >
      <div class="carousel-inner">

        <div class="carousel-item active">
          <img src="/imgs/1 (2).jpg" class="d-block w-100" alt="Corte de cabelo 1" />
        </div>

        <div class="carousel-item">
          <img src="/imgs/IMG_5798.jpg" class="d-block w-100" alt="Corte de cabelo 2" />
        </div>

        <div class="carousel-item">
          <img src="/imgs/IMG_5965.jpg" class="d-block w-100" alt="Corte de cabelo 3" />
        </div>

      </div>

      <!-- Controles -->
      <button class="carousel-control-prev" type="button" data-bs-target="#carouselSandro" data-bs-slide="prev">
        <span class="carousel-control-prev-icon"></span>
      </button>

      <button class="carousel-control-next" type="button" data-bs-target="#carouselSandro" data-bs-slide="next">
        <span class="carousel-control-next-icon"></span>
      </button>
    </div>
  </section>

</main>

  <!-- ================= FOOTER ================= -->
  <footer>
    <p>© 2025 Sandro Barbearia - Todos os direitos reservados</p>
  </footer>

  <!-- ================= SCRIPTS ================= -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>

</body>
</html>
