  <title>Sandro Barbearia</title>

  <!-- Bootstrap -->

</head>

<body>

<header>
  <div class="logo">
    <img src="/imgs/1 (1).jpg" />
  </div>

  <h1>Sandro Barbearia</h1>
  <p>💈 Estilo e tradição desde 1999 💈</p>
</header>

<main>

  <section class="links">

    <!-- BOTÃO WHATSAPP -->
    <button class="link-btn" data-bs-toggle="modal" data-bs-target="#modalWhatsApp">
      WhatsApp
    </button>

    <a href="https://www.instagram.com/sandrobarbearia.gv/" target="_blank" class="link-btn">
      Instagram
    </a>

    <button class="link-btn" onclick="abrirMapa()">
      📍 Como chegar
    </button>

  </section>

  <!-- MAPA -->
  <section class="mapa" onclick="abrirMapa()">
    <iframe
      src="https://www.google.com/maps?q=R. Castro Alves, 331 - Centro, Gov. Valadares - MG&output=embed"
      width="100%"
      height="220"
      style="border:0; border-radius:12px; pointer-events:none;"
    ></iframe>

    <p class="mapa-texto">📍 Toque no mapa para abrir a rota</p>
  </section>

  <!-- CARROSSEL -->
  <section class="mt-4">
    <div id="carouselSandro" class="carousel slide" data-bs-ride="carousel">

      <div class="carousel-inner">
        <div class="carousel-item active">
          <img src="/imgs/1 (2).jpg" class="d-block w-100"/>
        </div>

        <div class="carousel-item">
          <img src="/imgs/IMG_5798.jpg" class="d-block w-100"/>
        </div>

        <div class="carousel-item">
          <img src="/imgs/IMG_5965.jpg" class="d-block w-100"/>
        </div>
      </div>

      <button class="carousel-control-prev" type="button" data-bs-target="#carouselSandro" data-bs-slide="prev">
        <span class="carousel-control-prev-icon"></span>
      </button>

      <button class="carousel-control-next" type="button" data-bs-target="#carouselSandro" data-bs-slide="next">
        <span class="carousel-control-next-icon"></span>
      </button>

    </div>
  </section>

</main>

<footer>
  <p>© 2025 Sandro Barbearia</p>
</footer>

<!-- MODAL -->
<div class="modal fade" id="modalWhatsApp">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content text-center">

      <div class="modal-header">
        <h5 class="modal-title">Escolha o atendimento</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body d-flex flex-column gap-3">

        <a href="https://wa.me/5533988017495" target="_blank" class="btn btn-success">
          💬 Sandro
        </a>

        <a href="https://wa.me/5533999973756" target="_blank" class="btn btn-success">
          💬 Yury
        </a>

      </div>

    </div>
